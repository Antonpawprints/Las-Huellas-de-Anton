<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antonpawprints</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-principal">

    <div class="reproductor-fijo">
        <button id="boton-musica" aria-label="Reproducir Specialist">▶</button>

        <audio id="musica" loop>
            <source src="specialist(MP3_320K).mp3" type="audio/mpeg">
        </audio>
    </div>

    <iframe
        id="contenido"
        name="contenido"
        src="inicio.html"
        title="Las Huellas de Anton">
    </iframe>

    <script>
        const musica = document.getElementById("musica");
        const boton = document.getElementById("boton-musica");

        boton.addEventListener("click", async function() {
            if (musica.paused) {
                try {
                    await musica.play();
                    boton.textContent = "Ⅱ";
                } catch (error) {
                    console.log("No se pudo reproducir la canción.");
                }
            } else {
                musica.pause();
                boton.textContent = "▶";
            }
        });

        musica.addEventListener("pause", function() {
            boton.textContent = "▶";
        });

        musica.addEventListener("play", function() {
            boton.textContent = "Ⅱ";
        });
    </script>

</body>
</html>
